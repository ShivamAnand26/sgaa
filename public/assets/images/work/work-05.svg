<svg xmlns='http://www.w3.org/2000/svg' width='800' height='560' viewBox='0 0 800 560'>
    <defs>
      <pattern id='grid-05' width='24' height='24' patternUnits='userSpaceOnUse'>
        <path d='M 24 0 L 0 0 0 24' fill='none' stroke='rgba(196,122,59,0.07)' stroke-width='1'/>
      </pattern>
      <linearGradient id='grad-05' x1='0' y1='0' x2='1' y2='1'>
        <stop offset='0%' stop-color='#F4EFEA'/>
        <stop offset='100%' stop-color='#EAE3D7'/>
      </linearGradient>
    </defs>
    <rect width='800' height='560' fill='url(#grad-05)'/>
    <rect width='800' height='560' fill='url(#grid-05)'/>

    <!-- Drafting Outer Frame -->
    <rect x='28' y='28' width='744' height='504' fill='none' stroke='#C47A3B' stroke-width='1.2' stroke-opacity='0.4'/>
    <rect x='34' y='34' width='732' height='492' fill='none' stroke='#C47A3B' stroke-width='0.6' stroke-opacity='0.2'/>

    <!-- Isometric Blueprint Geometry -->
    <g transform='translate(400, 245)'>
      <!-- Concrete Pad -->
      <polygon points='0,-85 190,-15 0,55 -190,-15' fill='rgba(217,183,126,0.18)' stroke='#C47A3B' stroke-width='1.4'/>
      <!-- Lower Volume Walls -->
      <polygon points='-160,-20 0,45 0,140 -160,75' fill='rgba(196,122,59,0.12)' stroke='#C47A3B' stroke-width='1.4'/>
      <polygon points='0,45 160,-20 160,75 0,140' fill='rgba(196,122,59,0.22)' stroke='#C47A3B' stroke-width='1.4'/>
      <!-- Upper Cantilever -->
      <polygon points='-120,-80 30,-25 30,35 -120,-20' fill='rgba(255,255,255,0.7)' stroke='#C47A3B' stroke-width='1.2'/>
      <polygon points='30,-25 150,-70 150,-10 30,35' fill='rgba(255,255,255,0.85)' stroke='#C47A3B' stroke-width='1.2'/>
      <!-- Roof overhang slab -->
      <polygon points='-135,-85 30,-28 165,-75 0,-130' fill='none' stroke='#C47A3B' stroke-width='1.8'/>
      <!-- Elevation Glass Mullions -->
      <line x1='-90' y1='-35' x2='-90' y2='10' stroke='#C47A3B' stroke-width='1.2' stroke-opacity='0.6'/>
      <line x1='-40' y1='-15' x2='-40' y2='25' stroke='#C47A3B' stroke-width='1.2' stroke-opacity='0.6'/>
      <line x1='60' y1='-45' x2='60' y2='10' stroke='#C47A3B' stroke-width='1.2' stroke-opacity='0.6'/>
      <line x1='110' y1='-60' x2='110' y2='-5' stroke='#C47A3B' stroke-width='1.2' stroke-opacity='0.6'/>
      <!-- Crosshair Drafting Symbol -->
      <circle cx='0' cy='-20' r='14' fill='none' stroke='#C47A3B' stroke-width='0.8' stroke-dasharray='2 2'/>
      <line x1='-18' y1='-20' x2='18' y2='-20' stroke='#C47A3B' stroke-width='0.8'/>
      <line x1='0' y1='-38' x2='0' y2='-2' stroke='#C47A3B' stroke-width='0.8'/>
    </g>

    <!-- Bottom Metadata Plate -->
    <rect x='48' y='445' width='230' height='52' rx='6' fill='#FFFFFF' stroke='rgba(196,122,59,0.25)'/>
    <text x='64' y='467' font-family='sans-serif' font-size='10' font-weight='600' letter-spacing='1.5' fill='#C47A3B'>SAMPLE PROJECT 05</text>
    <text x='64' y='485' font-family='serif' font-size='15' font-weight='600' fill='#1C1B1A'>Commercial Building Concept</text>

    <!-- Right Watermark -->
    <text x='740' y='480' font-family='serif' font-size='13' font-weight='500' fill='rgba(28,27,26,0.45)' text-anchor='end'>SHILP GRIHA ASSOCIATE · AR. VIKAS VERMA</text>
  </svg>
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clients CRM — SGA Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <div class="admin-layout">
    <div id="shell-sidebar"></div>

    <main class="admin-main">
      <div id="shell-topbar"></div>

      <div class="admin-content-area">
        <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:24px; flex-wrap:wrap; gap:16px;">
          <div>
            <h1 style="font-family:var(--font-serif); font-size:32px; font-weight:600; color:var(--admin-ink); line-height:1.1;">
              Studio Clients CRM
            </h1>
            <p style="font-size:13.5px; color:var(--admin-ink-muted); margin-top:4px;">
              Architectural design clients, active planning commissions, proposals, and communication history.
            </p>
          </div>
        </div>

        <div class="data-table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>Client Name</th>
                <th>Contact Details</th>
                <th>Projects Count</th>
                <th>Proposals Issued</th>
                <th>Last Active</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="clients-table-body">
              <tr><td colspan="6" style="text-align:center; padding:30px; color:var(--admin-ink-muted);">Loading clients...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script type="module">
    import { adminApi } from '../client/js/admin-api.js';
    import { initAdminShell } from './js/admin-shell.js';

    async function initPage() {
      await initAdminShell('clients', 'Client CRM');
      const res = await adminApi.getClients();
      if (!res.ok) return;

      const tbody = document.getElementById('clients-table-body');
      if (res.data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding:40px; color:var(--admin-ink-muted);">No client records found.</td></tr>`;
        return;
      }

      tbody.innerHTML = res.data.map(c => `
        <tr>
          <td>
            <div style="display:flex; align-items:center; gap:10px;">
              <div style="width:34px; height:34px; border-radius:50%; background:var(--admin-sand); color:var(--admin-copper); display:flex; align-items:center; justify-content:center; font-weight:700;">
                ${c.fullName ? c.fullName[0] : 'C'}
              </div>
              <strong style="color:var(--admin-ink); font-size:13.5px;">${c.fullName}</strong>
            </div>
          </td>
          <td>
            <div>${c.email}</div>
            <span style="font-size:11px; color:var(--admin-ink-muted);">${c.phone || '—'}</span>
          </td>
          <td><strong>${c.requestsCount || 0}</strong> projects</td>
          <td>${c.proposalsCount || 0} proposals</td>
          <td style="font-size:12px; color:var(--admin-ink-muted);">${new Date(c.lastActivity || Date.now()).toLocaleDateString()}</td>
          <td>
            <a href="admin-client-details.html?id=${c.id}" class="admin-btn" style="padding:5px 12px; font-size:11.5px; width:auto;">
              Profile &rarr;
            </a>
          </td>
        </tr>
      `).join('');
    }

    initPage();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Document Reader — SGA.IN Student Portal</title>
  <meta name="description" content="In-browser architectural PDF viewer with page navigation, zoom controls, and verified student watermarking.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M7 30 32 8l25 22M16 36l31-9' fill='none' stroke='%23C47A3B' stroke-width='4'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="../client/css/tokens.css">
  <link rel="stylesheet" href="../client/css/base.css">
  <link rel="stylesheet" href="../client/css/components.css">
  <link rel="stylesheet" href="css/student.css">
  <!-- PDF.js & jsPDF CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body style="background:#141210; color:#FAF8F5; margin:0; padding:0; height:100vh; display:flex; flex-direction:column; overflow:hidden;">

  <!-- Reader Toolbar -->
  <header class="viewer-toolbar" id="viewer-toolbar">
    <div style="display:flex; align-items:center; gap:14px; min-width:0; flex:1;">
      <a href="browse-notes.html" class="viewer-btn" style="text-decoration:none; display:inline-flex; align-items:center; gap:8px; font-size:12.5px; padding:4px 10px; background:rgba(255,255,255,0.08); border-radius:6px; color:#FAF8F5; flex-shrink:0;">
        <div style="background:#FAF8F5; padding:2px 6px; border-radius:4px; display:inline-flex; align-items:center;">
          <img src="/assets/logo-full.png" alt="Shilp Griha Associate" style="height:20px; width:auto; max-width:90px; object-fit:contain; display:block;">
        </div>
        <span class="hide-mobile">&larr; Notes</span>
      </a>

      <div style="min-width:0;">
        <h1 id="viewer-title" style="font-family:var(--font-serif); font-size:16px; margin:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:360px; color:#FAF8F5;">
          Loading Note...
        </h1>
        <div style="display:flex; align-items:center; gap:8px; margin-top:2px;">
          <span id="viewer-mode-badge" style="font-size:10px; padding:2px 8px; border-radius:100px; font-weight:700; text-transform:uppercase; letter-spacing:0.06em;">...</span>
        </div>
      </div>
    </div>

    <!-- Page Controls -->
    <div style="display:flex; align-items:center; gap:8px; flex-shrink:0;">
      <button type="button" id="viewer-prev-btn" class="viewer-btn" title="Previous Page" aria-label="Previous Page">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
      </button>

      <span id="viewer-page-indicator" style="font-size:12.5px; font-weight:600; min-width:80px; text-align:center; color:#E5DFD7;">
        Page 1 of 1
      </span>

      <button type="button" id="viewer-next-btn" class="viewer-btn" title="Next Page" aria-label="Next Page">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>

    <!-- Zoom & Actions -->
    <div style="display:flex; align-items:center; gap:8px; flex-shrink:0;">
      <button type="button" id="viewer-zoom-out" class="viewer-btn" title="Zoom Out" aria-label="Zoom Out">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
      </button>

      <button type="button" id="viewer-zoom-in" class="viewer-btn" title="Zoom In" aria-label="Zoom In">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
      </button>

      <button type="button" id="viewer-fullscreen" class="viewer-btn" title="Toggle Fullscreen" aria-label="Toggle Fullscreen">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
      </button>

      <!-- Download Button (for purchased notes) -->
      <button type="button" id="viewer-download-btn" class="btn btn-primary btn-sm" style="display:none; height:34px; padding:0 12px; font-size:11.5px; gap:6px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        <span>Download PDF</span>
      </button>
    </div>
  </header>

  <!-- Document Viewport -->
  <main class="viewer-viewport" id="viewer-container">
    <!-- Watermark Layer (Purchased only) -->
    <div class="viewer-watermark-overlay" id="viewer-watermark" aria-hidden="true"></div>

    <!-- Canvas Rendering Container -->
    <div id="viewer-canvas-container" style="display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100%;">
      <div style="color:#FAF8F5; text-align:center; padding:40px;">
        <p style="font-size:14px; color:var(--muted);">Initializing PDF Canvas Engine...</p>
      </div>
    </div>
  </main>

  <script type="module">
    import { initNoteViewer } from './js/viewer.js';
    initNoteViewer();
  </script>
</body>
</html>

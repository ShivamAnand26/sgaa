<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications — Shilp Griha Associate (SGA)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/portal.css">
</head>
<body class="portal-layout">

  <!-- Left Sidebar -->
  <aside class="portal-sidebar" id="portal-sidebar" aria-label="Portal Navigation">
    <div class="sidebar-brand">
      <a href="../index.html" class="brand-link" style="display:flex; flex-direction:column; gap:4px; text-decoration:none;">
        <img src="/assets/logo-full.png" alt="Shilp Griha Associate" style="height:36px; width:auto; max-width:160px; object-fit:contain; display:block;">
        <span style="display:block; font-size:9.5px; color:var(--copper); font-weight:600; letter-spacing:0.12em; text-transform:uppercase; padding-left:2px;">Client Portal</span>
      </a>
      <button type="button" class="sidebar-close" id="sidebar-close" aria-label="Close menu">&times;</button>
    </div>

    <nav class="sidebar-nav">
      <a href="dashboard.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/>
          <rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>
        </svg>
        <span>Dashboard</span>
      </a>

      <a href="new-request.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/>
        </svg>
        <span>Submit Request</span>
      </a>

      <a href="my-requests.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/>
          <line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/>
        </svg>
        <span>My Requests</span>
      </a>

      <a href="notifications.html" class="nav-item is-active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
        <span>Notifications</span>
        <span class="nav-badge" id="nav-notif-badge" style="display:none;">0</span>
      </a>

      <a href="profile.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
        </svg>
        <span>My Profile</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="user-mini-card">
        <div class="user-avatar-circle" id="sidebar-avatar">C</div>
        <div class="user-mini-info">
          <span class="user-mini-name" id="user-display-name">Client</span>
          <span class="user-mini-email" id="user-display-email">client@sga.in</span>
        </div>
      </div>
    </div>
  </aside>

  <!-- Main Wrap -->
  <div class="portal-main">
    <header class="portal-header">
      <div class="header-left">
        <button type="button" class="mobile-nav-toggle" id="mobile-nav-toggle" aria-label="Toggle navigation menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
        <h1 class="page-title">Notifications</h1>
      </div>

      <div class="header-actions">
        <button type="button" id="mark-all-read-btn" class="btn btn-secondary btn-sm">
          Mark All as Read
        </button>
        <a href="profile.html" class="header-user-btn" aria-label="Profile settings">
          <div class="header-user-avatar" id="header-avatar">C</div>
          <span class="header-user-name">Account</span>
        </a>
      </div>
    </header>

    <main class="portal-content page-fade-in">
      <div style="margin-bottom:28px;">
        <p class="section-label">Studio Communications</p>
        <h2 style="font-size:32px; margin-top:4px;">Updates & Notices</h2>
        <p style="margin-top:4px;">Real-time notifications whenever your architectural plan advances or messages arrive.</p>
      </div>

      <section id="notifications-container">
        <div class="skeleton" style="height:200px;"></div>
      </section>
    </main>
  </div>

  <script type="module">
    import { initNotifications } from './js/notifications.js';
    initNotifications();
  </script>
</body>
</html>
